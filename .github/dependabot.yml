# Opens pull requests when a pinned GitHub Action or a Terraform provider has a new version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: terraform
    directories:
      - /foundations/*/*
      - /projects/*/infra/*
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      terraform-providers:
        patterns:
          - "*"
