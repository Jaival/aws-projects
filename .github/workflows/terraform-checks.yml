# Runs on every pull request: formatting + validation of every Terraform folder.
# Needs no cloud credentials. Project 09 adds the OIDC plan/apply pipeline on top of this.
name: terraform-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.13"
      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  discover:
    name: find Terraform folders
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.find.outputs.dirs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: find
        # Every folder that contains at least one .tf file becomes a matrix entry.
        run: |
          dirs=$(find . -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u | sed 's|^\./||' | jq -R . | jq -cs .)
          echo "Found: $dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

  validate:
    name: validate ${{ matrix.dir }}
    needs: discover
    if: needs.discover.outputs.dirs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.discover.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "~1.13"
      - name: terraform init (no backend)
        run: terraform init -backend=false -input=false
      - name: terraform validate
        run: terraform validate
      - name: terraform test (mock providers, no cloud credentials)
        if: hashFiles(format('{0}/tests/*.tftest.hcl', matrix.dir)) != ''
        run: terraform test

  # One stable check name to require in branch protection, however many folders the matrix has.
  all-checks:
    name: all checks passed
    if: always()
    needs: [fmt, discover, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo "fmt=${{ needs.fmt.result }} discover=${{ needs.discover.result }} validate=${{ needs.validate.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
